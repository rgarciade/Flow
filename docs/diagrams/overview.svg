-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">FLOW · ISSUE-DRIVEN DEVELOPMENT</text><text x="30" y="50" fill="#2d3142" font-size="18" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Three skills, one shared config</text><rect x="340" y="72" width="220" height="58" rx="6" fill="#f5f5f5"/><rect x="340" y="72" width="220" height="58" rx="6" fill="#fff" stroke="#2e5aa8" stroke-width="1.2"/><text x="450.0" y="94" fill="#2d3142" font-size="13" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Task tracker</text><text x="450.0" y="112" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">GitHub, Jira, Linear, files…</text><rect x="720" y="72" width="140" height="58" rx="6" fill="#f5f5f5"/><rect x="720" y="72" width="140" height="58" rx="6" fill="#fff" stroke="#2e5aa8" stroke-width="1.2"/><text x="790.0" y="94" fill="#2d3142" font-size="13" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Pull request</text><text x="790.0" y="112" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">you review + merge</text><rect x="40" y="190" width="220" height="84" rx="6" fill="#f5f5f5"/><rect x="40" y="190" width="220" height="84" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="150.0" y="212" fill="#2d3142" font-size="13" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">flow-setup</text><text x="150.0" y="230" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">once per repo</text><text x="150.0" y="245" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">writes docs + config</text><rect x="340" y="190" width="220" height="84" rx="6" fill="#f5f5f5"/><rect x="340" y="190" width="220" height="84" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="450.0" y="212" fill="#2d3142" font-size="13" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">flow-plan</text><text x="450.0" y="230" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">big picture + leads</text><text x="450.0" y="245" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">no code, you approve</text><rect x="640" y="190" width="220" height="84" rx="6" fill="#f5f5f5"/><rect x="640" y="190" width="220" height="84" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1.6"/><text x="750.0" y="212" fill="#2d3142" font-size="13" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">flow-work</text><text x="750.0" y="230" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">one task to a PR, with you</text><text x="750.0" y="245" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">plan + status on the task</text><text x="750.0" y="260" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">code, tests, docs, ADRs</text><rect x="40" y="350" width="820" height="90" rx="6" fill="#f5f5f5"/><rect x="40" y="350" width="820" height="90" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="450.0" y="372" fill="#2d3142" font-size="13" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">docs/agents/ in the target repo</text><text x="450.0" y="390" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">tracker.md   domain.md   workflow.md</text><text x="450.0" y="405" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">+ an  ## Agent skills  block in CLAUDE.md / AGENTS.md</text><rect x="40" y="478" width="820" height="62" rx="6" fill="#f5f5f5"/><rect x="40" y="478" width="820" height="62" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4,3"/><text x="450.0" y="500" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Vendored skills</text><text x="450.0" y="518" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">domain docs setup (read by flow-setup)  |  to-tickets (read by flow-plan, flow-work)</text><text x="66" y="578" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">writes</text><text x="160.8" y="578" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">reads / produces</text><text x="313.6" y="578" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">flow-plan and flow-work offer flow-setup when workflow.md is missing</text></svg>