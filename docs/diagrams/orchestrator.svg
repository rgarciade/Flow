<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="orchestrator-title orchestrator-desc"><title id="orchestrator-title">flow-work orchestrator and subagents</title><desc id="orchestrator-desc">The orchestrator talks to the user and briefs the roles with note keys; each role runs as a subagent or in another harness, as set in the Harnesses table, and saves its full result to notes and returns at most 15 lines.</desc><defs><marker id="orchestrator-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="orchestrator-as" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="orchestrator-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="orchestrator-c" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><path d="M210,108 L330,108" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#orchestrator-a)" marker-start="url(#orchestrator-as)"/><rect x="250.5" y="90" width="39.0" height="13" rx="2" fill="#f5f5f5"/><text x="270" y="99" fill="#4f5d75" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.05em">GATES</text><path d="M430,140 L430,210" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#orchestrator-a)"/><rect x="310.6" y="171" width="113.4" height="13" rx="2" fill="#f5f5f5"/><text x="420" y="180" fill="#4f5d75" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end" letter-spacing="0.05em">BRIEF + NOTE KEYS</text><path d="M500,210 L500,140" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#orchestrator-l)"/><rect x="506.0" y="171" width="144.4" height="13" rx="2" fill="#f5f5f5"/><text x="510" y="180" fill="#2e5aa8" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" letter-spacing="0.05em">&lt;=15 LINES + QUESTIONS</text><path d="M250,360 L250,430" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#orchestrator-a)"/><rect x="256.0" y="391" width="113.4" height="13" rx="2" fill="#f5f5f5"/><text x="260" y="400" fill="#4f5d75" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" letter-spacing="0.05em">SAVE: FULL RESULT</text><path d="M650,430 L650,360" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#orchestrator-l)"/><rect x="524.4" y="391" width="119.6" height="13" rx="2" fill="#f5f5f5"/><text x="640" y="400" fill="#2e5aa8" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end" letter-spacing="0.05em">READ: PRIOR PHASES</text><text x="30" y="28" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">ORCHESTRATION</text><text x="30" y="50" fill="#2d3142" font-size="18" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">One thin thread, the bulk work goes to the roles</text><rect x="40" y="76" width="170" height="64" rx="6" fill="#f5f5f5"/><rect x="40" y="76" width="170" height="64" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="125.0" y="98" fill="#2d3142" font-size="13" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">You</text><text x="125.0" y="116" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">decide, commit, merge</text><rect x="330" y="76" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="330" y="76" width="240" height="64" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1.6"/><text x="450.0" y="98" fill="#2d3142" font-size="13" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Orchestrator</text><text x="450.0" y="116" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">the session you open</text><rect x="680" y="76" width="190" height="64" rx="6" fill="#f5f5f5"/><rect x="680" y="76" width="190" height="64" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4,3"/><text x="775.0" y="98" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Hard rules</text><text x="775.0" y="116" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">one writer at a time</text><text x="775.0" y="131" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">never commits or merges</text><rect x="28" y="210" width="844" height="150" rx="8" fill="#f5f5f5"/><rect x="28" y="210" width="844" height="150" rx="8" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/><text x="40" y="228" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">ROLES  (subagent or another harness, with its model, per the Harnesses table in workflow.md)</text><rect x="40" y="240" width="108" height="108" rx="6" fill="#f5f5f5"/><rect x="40" y="240" width="108" height="108" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="94.0" y="262" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">research</text><rect x="48" y="266" width="92" height="15" rx="3