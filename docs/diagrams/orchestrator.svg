-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">test files only</text><text x="379.0" y="326" fill="#eb6c36" font-size="9" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">WRITES</text><rect x="454" y="240" width="126" height="108" rx="6" fill="#f5f5f5"/><rect x="454" y="240" width="126" height="108" rx="6" fill="#fff" stroke="#eb6c36" stroke-width="1.6"/><text x="517.0" y="262" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">implement</text><rect x="462" y="266" width="110" height="15" rx="3" fill="#2d3142"/><text x="517.0" y="276.5" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">FAST</text><text x="517.0" y="308" fill="#4f5d75" font-size="9.5" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">never tests</text><text x="517.0" y="326" fill="#eb6c36" font-size="9" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">WRITES</text><rect x="592" y="240" width="126" height="108" rx="6" fill="#f5f5f5"/><rect x="592" y="240" width="126" height="108" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="655.0" y="262" fill="#2d3142" font-size="11" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">review-standards</text><rect x="600" y="266" width="110" height="15" rx="3" fill="#2d3142"/><text x="655.0" y="276.5" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">FAST</text><text x="655.0" y="308" fill="#4f5d75" font-size="9.5" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">with review-spec</text><text x="655.0" y="326" fill="#4f5d75" font-size="9" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">READ-ONLY</text><rect x="730" y="240" width="126" height="108" rx="6" fill="#f5f5f5"/><rect x="730" y="240" width="126" height="108" rx="6" fill="#fff" stroke="#eb6c36" stroke-width="1.6"/><text x="793.0" y="262" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">fix</text><rect x="738" y="266" width="110" height="15" rx="3" fill="#2d3142"/><text x="793.0" y="276.5" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">FAST</text><text x="793.0" y="308" fill="#4f5d75" font-size="9.5" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">never tests</text><text x="793.0" y="326" fill="#eb6c36" font-size="9" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">WRITES</text><rect x="28" y="430" width="844" height="70" rx="6" fill="#f5f5f5"/><rect x="28" y="430" width="844" height="70" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="450.0" y="452" fill="#2d3142" font-size="13" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Notes: Engram, or .scratch/flow/ files</text><text x="450.0" y="470" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">flow/&lt;repo&gt;/&lt;issue&gt;/&lt;phase&gt;   e.g. flow/my-app/42/research</text><text x="450.0" y="485" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">phases: research, plan, tests, implement, review-standards, review-spec</text></svg>