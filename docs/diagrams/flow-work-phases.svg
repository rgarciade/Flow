fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">choose findings</text><rect x="38" y="406" width="124" height="15" rx="3" fill="#2d3142"/><text x="100.0" y="417" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">fix / refactor commit</text><rect x="198" y="330" width="140" height="100" rx="6" fill="#f5f5f5"/><rect x="198" y="330" width="140" height="100" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1.6"/><text x="268.0" y="352" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">8 Report + PR</text><text x="268.0" y="370" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">base check, ADRs</text><rect x="206" y="398" width="124" height="15" rx="3" fill="#eb6c36"/><text x="268.0" y="408.5" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">open PR?</text><rect x="198" y="470" width="140" height="100" rx="6" fill="#f5f5f5"/><rect x="198" y="470" width="140" height="100" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1.6"/><text x="268.0" y="492" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">9 PR review</text><text x="268.0" y="510" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">answer comments</text><rect x="206" y="524" width="124" height="15" rx="3" fill="#eb6c36"/><text x="268.0" y="534.5" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">choose comments</text><rect x="206" y="546" width="124" height="15" rx="3" fill="#2d3142"/><text x="268.0" y="557" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">fix commit</text><rect x="534" y="470" width="310" height="100" rx="6" fill="#f5f5f5"/><rect x="534" y="470" width="310" height="100" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4,3"/><text x="689.0" y="492" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Park or abandon</text><text x="689.0" y="510" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">at any phase, on your OK:</text><text x="689.0" y="525" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">state note parked or closed</text><rect x="366" y="330" width="140" height="100" rx="6" fill="#f5f5f5"/><rect x="366" y="330" width="140" height="100" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1.6"/><text x="436.0" y="352" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">You merge the PR</text><text x="436.0" y="370" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">on the code host,</text><text x="436.0" y="385" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">never the agent</text><rect x="374" y="406" width="124" height="15" rx="3" fill="#eb6c36"/><text x="436.0" y="416.5" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">GATE</text><rect x="534" y="330" width="140" height="100" rx="6" fill="#f5f5f5"/><rect x="534" y="330" width="140" height="100" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4,3"/><text x="604.0" y="352" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">After merge</text><text x="604.0" y="370" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">next sibling, or</text><text x="604.0" y="385" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">arch review + group PR</text><polygon points="604,194 674,240 604,286 534,240" fill="#f5f5f5"/><polygon points="604,194 674,240 604,286 534,240" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="604" y="238" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Task too big?</text><text x="604" y="253" fill="#4f5d75" font-size="9" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">size verdict</text><rect x="710" y="176" width="170" height="152" rx="6" fill="#f5f5f5"/><rect x="710" y="176" width="170" height="152" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1.6"/><text x="795.0" y="198" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Too big: you choose</text><rect x="718" y="204" width="154" height="15" rx="3" fill="#eb6c36"/><text x="795.0" y="214.5" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">GATE</text><text x="718" y="236" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">(a) trim to first slice;</text><text x="718" y="251" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">new tasks for the rest</text><text x="718" y="266" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">(b) become parent;</text><text x="718" y="281" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">slices = child tasks</text><text x="718" y="296" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">then continue</text><rect x="30" y="605" width="40" height="15" rx="3" fill="#eb6c36"/><text x="50.0" y="615.5" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">GATE</text><text x="78" y="616" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">user decides</text><text x="191.6" y="616" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">COMMIT</text><text x="219.6" y="616" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">user runs commit + push; agent never commits</text><text x="534.8" y="616" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">after merge, or only when you ask</text><text x="30" y="660" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Default mode: semi-autonomous. Pair or autonomous mode, the deep profile and status moves: always on your OK.</text></svg>