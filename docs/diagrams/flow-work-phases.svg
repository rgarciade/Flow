ght="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">create-branch,</text><text x="436.0" y="115" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">baseline test run</text><rect x="534" y="60" width="140" height="100" rx="6" fill="#f5f5f5"/><rect x="534" y="60" width="140" height="100" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1.6"/><text x="604.0" y="82" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">3 Research</text><text x="604.0" y="100" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">fast, size verdict</text><rect x="542" y="128" width="124" height="15" rx="3" fill="#eb6c36"/><text x="604.0" y="138.5" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">read summary</text><rect x="366" y="190" width="140" height="100" rx="6" fill="#f5f5f5"/><rect x="366" y="190" width="140" height="100" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1.6"/><text x="436.0" y="212" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">4 Plan</text><text x="436.0" y="230" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">strong, docs + ADRs</text><rect x="374" y="258" width="124" height="15" rx="3" fill="#eb6c36"/><text x="436.0" y="268.5" fill="#fff" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">confirm plan</text><rect x="198" y="190" width="140" height="100" rx="6" fill="#f5f5f5"/><rect x="198" y="190" width="140" height="100" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-widt