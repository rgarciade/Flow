<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="branching-title branching-desc"><title id="branching-title">flow branch model</title><desc id="branching-desc">Branch model: task branches merge by pull request into a group branch, the group branch merges into the base branch; standalone tasks go straight to the base branch.</desc><defs><marker id="branching-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="branching-as" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="branching-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="branching-c" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><polyline points="40,100 860,100" fill="none" stroke="#2d3142" stroke-width="2.5" stroke-linejoin="round"/><polyline points="120,190 360,190" fill="none" stroke="#2d3142" stroke-width="2.5" stroke-linejoin="round"/><polyline points="440,290 840,290" fill="none" stroke="#2d3142" stroke-width="2.5" stroke-linejoin="round"/><polyline points="520,380 620,380" fill="none" stroke="#2d3142" stroke-width="2.5" stroke-linejoin="round"/><polyline points="700,470 780,470" fill="none" stroke="#2d3142" stroke-width="2.5" stroke-linejoin="round"/><path d="M120,100 L120,189" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#branching-a)"/><path d="M440,100 L440,289" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#branching-a)"/><path d="M520,290 L520,379" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#branching-a)"/><path d="M700,290 L700,469" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#branching-a)"/><path d="M360,190 L360,100" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#branching-c)"/><path d="M840,290 L840,100" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#branching-c)"/><path d="M620,380 L620,290" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#branching-c)"/><path d="M780,470 L780,290" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#branching-c)"/><rect x="282.0" y="151" width="70.0" height="13" rx="2" fill="#f5f5f5"/><text x="348" y="160" fill="#eb6c36" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end" letter-spacing="0.05em">PR to base</text><rect x="724.8" y="151" width="107.2" height="13" rx="2" fill="#f5f5f5"/><text x="828" y="160" fill="#eb6c36" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end" letter-spacing="0.05em">GROUP PR to base</text><rect x="535.8" y="353" width="76.2" height="13" rx="2" fill="#f5f5f5"/><text x="608" y="362" fill="#eb6c36" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end" letter-spacing="0.05em">PR to group</text><rect x="788.0" y="431" width="76.2" height="13" rx="2" fill="#f5f5f5"/><text x="792" y="440" fill="#eb6c36" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" letter-spacing="0.05em">PR to group</text><line x1="30" y1="526" x2="870" y2="526" stroke="rgba(45,49,66,0.15)"/><line x1="30" y1="542" x2="58" y2="542" stroke="#4f5d75" stroke-width="1.4"/><line x1="153.8" y1="542" x2="181.8" y2="542" stroke="#2e5aa8" stroke-width="1.4"/><text x="30" y="28" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">BRANCHING</text><text x="30" y="50" fill="#2d3142" font-size="18" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Every PR targets one level up, every branch is linked to its task</text><circle cx="160" cy="190" r="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="240" cy="190" r="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="320" cy="190" r="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="560" cy="380" r="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="590" cy="380" r="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="730" cy="470" r="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="755" cy="470" r="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="480" cy="290" r="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="660" cy="290" r="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="810" cy="290" r="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="360" cy="100" r="6" fill="#eb6c36" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="840" cy="100" r="6" fill="#eb6c36" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="620" cy="290" r="6" fill="#eb6c36" stroke="#f5f5f5" stroke-width="1.5"/><circle cx="780" cy="290" r="6" fill="#eb6c36" stroke="#f5f5f5" stroke-width="1.5"/><text x="48" y="86" fill="#2d3142" font-size="11" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">dev  (base branch from workflow.md)</text><text x="132" y="176" fill="#2d3142" font-size="11" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">task/&lt;id&gt;-&lt;slug&gt;   standalone</text><text x="452" y="276" fill="#2d3142" font-size="11" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">feature/&lt;parent-id&gt;-&lt;slug&gt;   group branch</text><text x="508" y="384" fill="#2d3142" font-size="11" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end">task/&lt;n1&gt;-&lt;slug&gt;</text><text x="688" y="474" fill="#2d3142" font-size="11" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end">task/&lt;n2&gt;-&lt;slug&gt;</text><rect x="40" y="330" width="330" height="120" rx="6" fill="#f5f5f5"/><rect x="40" y="330" width="330" height="120" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1.6"/><text x="205.0" y="352" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Blocked children wait</text><text x="205.0" y="370" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">task n2 is blocked by n1:</text><text x="205.0" y="385" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">it branches only after n1&#x27;s PR</text><text x="205.0" y="400" fill="#4f5d75" font-size="10" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">is merged into the group branch</text><rect x="40" y="468" width="330" height="48" rx="6" fill="#f5f5f5"/><rect x="40" y="468" width="330" height="48" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="205.0" y="490" fill="#2d3142" font-size="12" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">You review and merge every PR</text><text x="66" y="546" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">branch from</text><text x="189.8" y="546" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">PR (you merge)</text><text x="330" y="545" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">create-branch links each branch to its task · pull --ff-only first · push every commit</text></svg>